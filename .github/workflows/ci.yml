name: CI

on:
  push:
    # A bare `push:` fires on tag pushes too, so cutting a release would run
    # this whole matrix a second time against a commit its own branch
    # has already tested -- while release.yml is independently building and
    # `--self-test`ing that same commit on those same three platforms. Tags
    # belong to release.yml; branch pushes and PRs still land here.
    tags-ignore:
      - "**"
  pull_request:

# Cancel superseded runs instead of burning CI minutes on a push that is
# already obsolete.
#
# The key is `head_ref || ref_name`, which is what makes a same-repo pull
# request run once instead of twice. Both `push` and `pull_request` fire for
# such a PR, and the two events disagree about github.ref: the push run sees
# refs/heads/my-branch while the PR run sees refs/pull/N/merge. Keying on
# github.ref therefore put them in *different* groups, so neither cancelled
# the other and the full matrix ran twice per commit. github.head_ref is set
# only on pull_request (to the source branch's short name, `my-branch`) and
# github.ref_name is that same short name on push, so the two events now
# collide in one group and the duplicate is cancelled on arrival rather than
# run to completion.
#
# Pushes to a branch with no PR open still get a run, which is why this is
# fixed here rather than by narrowing `push` to the default branch.
# Fork PRs fire no push event in this repository, so they were never doubled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # pyproject.toml declares requires-python = ">=3.12", so 3.12, 3.13 and
      # 3.14 are all supported claims and all three are tested -- but only on
      # Linux, with macOS and Windows pinned to the 3.13 that release.yml
      # actually ships. Five jobs instead of the nine a full cross-product
      # would cost, because the two axes fail for unrelated reasons:
      #
      #   * interpreter-specific breakage (removed stdlib APIs, syntax,
      #     a dependency with no wheel for that version) is the same bug on
      #     every OS, and Linux is the cheapest and fastest runner to find it
      #     on;
      #   * OS-specific breakage (pynput's per-platform backends, Qt platform
      #     plugins, path and filesystem behaviour) is the same bug on every
      #     interpreter.
      #
      # The four dropped legs only catch an OS-by-version *interaction*, and
      # the likeliest such bug is not a missing wheel: everything in
      # [dev,gui] installs as pure Python or as a stable-ABI wheel
      # (PySide6-Essentials ships one cp310-abi3 wheel per platform, valid for
      # 3.10 onwards), so "no wheel for this interpreter on this OS" is not a
      # realistic failure here. What these legs could miss is an interpreter
      # change meeting a platform-specific code path -- most plausibly
      # pynput's ctypes bindings onto the Win32 and Quartz APIs, which are
      # different code on every OS and are the one place a CPython change
      # could break exactly one (os, version) pair. That is the accepted cost
      # of this shape; if it ever bites, add the edge versions on Windows
      # rather than going to nine.
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.12"
          - os: ubuntu-22.04
            python-version: "3.13"
          - os: ubuntu-22.04
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    env:
      # pynput and Qt both need *some* display/platform backend to
      # initialize even when nothing is ever shown; the offscreen QPA
      # plugin satisfies Qt everywhere, and the Linux job additionally
      # runs pytest itself under Xvfb below for pynput's X11 backend,
      # which does not honor QT_QPA_PLATFORM at all.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Linux Qt/X11 runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libegl1 \
            libgl1

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui]"

      - name: Run tests (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest

      - name: Run tests
        if: runner.os != 'Linux'
        run: python -m pytest
