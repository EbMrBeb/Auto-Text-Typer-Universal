[project]
name = "auto-essay-typer"
version = "0.1.0"
description = "Types supplied text into any application with human-like rhythm and self-corrected mistakes"
requires-python = ">=3.12"
dependencies = ["pynput>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-qt>=4"]
menubar = ["rumps>=0.4"]
gui = ["PySide6-Essentials>=6.8"]
build = ["pyinstaller>=6.12", "Pillow>=10", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["auto_essay_typer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.report]
fail_under = 80
