[project]
name = "auto-text-typer"
version = "0.1.0"
description = "Types supplied text into any application with human-like rhythm and self-corrected mistakes"
requires-python = ">=3.12"
dependencies = ["pynput>=1.8", "truststore>=0.10", "certifi>=2024.2.2"]

[project.scripts]
auto-text-typer = "auto_essay_typer.cli:main"

[project.gui-scripts]
auto-text-typer-gui = "auto_essay_typer.gui.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-qt>=4"]
gui = ["PySide6-Essentials>=6.8"]
build = ["pyinstaller>=6.12", "Pillow>=10", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["auto_essay_typer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: opt-in test that makes a real network request (set ATT_NETWORK_TESTS=1 to run)",
]

[tool.coverage.report]
fail_under = 80
